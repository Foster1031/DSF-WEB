<style>
  :root{
    --paper:#f3f4f1; --panel:#ffffff; --ink:#16233b; --ink-soft:#4a5a72; --muted:#8b97a7;
    --line:#e3e6e0; --line-strong:#cfd4cc; --navy:#1f3a5f; --navy-2:#2c5e8f; --slate:#9fb2cb;
    --warm:#d98a5b; --teal:#2f8a86; --gold:#b88a2a; --good:#2f8a5b; --bad:#c0563f;
    --shadow:0 1px 2px rgba(22,35,59,.06),0 4px 18px rgba(22,35,59,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  a{color:var(--navy-2);text-decoration:none} a:hover{text-decoration:underline}

  .topbar{display:flex;align-items:center;gap:18px;padding:14px 22px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
  .brand{display:flex;align-items:center;gap:12px;white-space:nowrap}
  .brand .mark{width:30px;height:30px;border-radius:5px;background:linear-gradient(150deg,var(--navy),#16273f);display:grid;place-items:center;color:#fff;font-weight:600;font-size:13px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  .brand h1{font-size:15px;letter-spacing:.06em;font-weight:600;margin:0;text-transform:uppercase}
  .brand .sub{font-size:11px;color:var(--muted);letter-spacing:.02em}
  .topbar .divider{width:1px;height:30px;background:var(--line)}
  .stamp{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-soft)}
  .stamp b{color:var(--ink);font-weight:500}
  .topbar .spacer{flex:1}
  .btn{font:inherit;font-size:12.5px;cursor:pointer;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);padding:7px 13px;border-radius:6px;display:inline-flex;align-items:center;gap:7px;transition:.15s}
  .btn:hover{border-color:var(--navy);color:var(--navy)}
  .btn svg{width:14px;height:14px}

  .shell{display:flex;min-height:calc(100vh - 61px)}
  nav.pages{width:236px;flex:0 0 236px;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto}
  nav.pages .ph{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:4px 12px 12px;font-weight:600}
  nav.pages button{display:block;width:100%;text-align:left;border:0;background:transparent;font:inherit;color:var(--ink-soft);padding:9px 12px;border-radius:7px;cursor:pointer;margin-bottom:2px;border-left:2px solid transparent;transition:.12s}
  nav.pages button:hover{background:#f5f6f3;color:var(--ink)}
  nav.pages button.active{background:#eef2f6;color:var(--navy);font-weight:600;border-left-color:var(--navy)}
  main{flex:1;min-width:0;padding:26px 30px 60px}

  .pagehead{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--navy);padding-bottom:12px;margin-bottom:18px;flex-wrap:wrap;gap:10px}
  .pagehead .title{font-family:"Newsreader",serif;font-style:italic;font-weight:500;font-size:30px;color:var(--navy);line-height:1.1}
  .pagehead .desc{color:var(--ink-soft);font-size:12.5px;max-width:560px;margin-top:6px}
  .pagehead .tag{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:5px 12px;white-space:nowrap}

  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
  @media(max-width:1080px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);padding:16px 18px 14px;display:flex;flex-direction:column;min-height:300px;animation:rise .5s ease both}
  .card.wide{grid-column:1 / -1}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card .chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px}
  .card .ctitle{font-weight:600;font-size:13.5px;color:var(--ink)}
  .card .cnote{font-size:11px;color:var(--muted);margin-top:2px}
  .card .latest{text-align:right;white-space:nowrap}
  .card .latest .val{font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:500;color:var(--navy);line-height:1}
  .card .latest .when{font-size:10.5px;color:var(--muted);margin-top:3px}

  .legend{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0 2px;font-size:11.5px;color:var(--ink-soft)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:14px;height:3px;border-radius:2px;display:inline-block}

  .ctrls{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;min-height:22px}
  .rangebtns{display:flex;gap:3px;flex-wrap:wrap}
  .rangebtns button{font:inherit;font-size:10.5px;font-family:"IBM Plex Mono",monospace;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:3px 8px;border-radius:5px;cursor:pointer;transition:.12s}
  .rangebtns button:hover{color:var(--ink);border-color:var(--line-strong)}
  .rangebtns button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .stale-note{font-family:"IBM Plex Mono",monospace;font-size:10px;white-space:nowrap}
  .stale-note .stale{color:var(--gold)}
  .stale-note .livenote{color:var(--good)}

  .chart-wrap{flex:1;position:relative;margin-top:8px;min-height:180px}
  .chart-wrap svg{width:100%;height:100%;display:block;overflow:visible}
  .brush{height:34px;margin-top:8px;position:relative;touch-action:none}
  .brush svg{width:100%;height:100%;display:block}
  .brush .sel{fill:rgba(31,58,95,.07);stroke:var(--navy);stroke-width:1;cursor:grab}
  .brush .handle{fill:var(--navy);cursor:ew-resize}
  .brush .handle:hover{fill:var(--navy-2)}

  .tooltip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-family:"IBM Plex Mono",monospace;font-size:11px;padding:6px 9px;border-radius:6px;transform:translate(-50%,-115%);white-space:nowrap;opacity:0;transition:opacity .08s;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .tooltip .tt-d{color:#9fb2cb;font-size:10px;display:block;margin-bottom:2px}
  .tooltip .tt-row{display:flex;align-items:center;gap:6px}
  .tooltip .tt-row i{width:8px;height:8px;border-radius:2px;display:inline-block}

  .state{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12.5px}
  .spinner{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--navy);animation:spin .8s linear infinite;margin:0 auto 10px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .state .retry{margin-top:10px}
  .state.err{color:var(--bad)}

  .footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.6;max-width:900px}
  .footer code{font-family:"IBM Plex Mono",monospace;background:#eef0ec;padding:1px 5px;border-radius:4px;color:var(--ink-soft);font-size:11px}
  .banner{background:#fbf7ee;border:1px solid #e8dcc0;color:#7a6230;border-radius:9px;padding:11px 15px;font-size:12px;margin-bottom:18px;display:flex;gap:10px;align-items:flex-start}
  .banner svg{width:15px;height:15px;flex:0 0 15px;margin-top:1px}
  .hint{font-size:11.5px;color:var(--muted);margin:-4px 0 16px}

  .brand .mark-img{height:36px;width:auto;display:block}
  .pagehead{align-items:center}
  .fnf-logo{height:46px;width:auto;display:block;flex:0 0 auto}
  .subhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:10px 0 4px;flex-wrap:wrap}
  .subhead .desc{color:var(--ink-soft);font-size:12.5px;max-width:560px}
  .subhead .tag{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:5px 12px;white-space:nowrap}

/* ============================================================
   DATA LAYER — FRED keyless CSV via CORS proxies
   - throttled (limited concurrency) to avoid proxy rate limits
   - localStorage cache => charts stay populated even if a
     later live fetch fails ("cached" badge)
   ============================================================ */
const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://thingproxy.freeboard.io/fetch/" + u
];
function withTimeout(p, ms){
  return new Promise((res,rej)=>{ const id=setTimeout(()=>rej(new Error("timeout")),ms);
    p.then(v=>{clearTimeout(id);res(v);}, e=>{clearTimeout(id);rej(e);}); });
}
async function tryProxy(make,url,ms){
  const r=await withTimeout(fetch(make(url),{cache:"no-store"}), ms);
  if(!r.ok) throw new Error("HTTP "+r.status);
  const t=await r.text();
  if(t && t.indexOf(",")>-1 && t.length>12) return t;
  throw new Error("bad payload");
}
// fast=true (foreground): race the two quickest proxies so a slow/down one
// never stalls the tile. Background prefetch stays single-stream to stay polite.
async function fetchText(url, fast){
  if(fast){
    try{ return await Promise.any([ tryProxy(PROXIES[0],url,6500), tryProxy(PROXIES[1],url,6500) ]); }catch(e){}
    for(const m of PROXIES.slice(2)){ try{ return await tryProxy(m,url,7000); }catch(e){} }
    throw new Error("all proxies failed");
  }
  for(const m of PROXIES){ try{ return await tryProxy(m,url,8000); }catch(e){} }
  throw new Error("all proxies failed");
}
// concurrency-limited queue; foreground requests jump the queue
const LIMIT=5; let active=0; const Q=[];
function enqueue(fn, front){ return new Promise((res,rej)=>{ const it={fn,res,rej};
  if(front) Q.unshift(it); else Q.push(it); pump(); }); }
function pump(){ while(active<LIMIT && Q.length){ const {fn,res,rej}=Q.shift(); active++;
  fn().then(res,rej).finally(()=>{ active--; pump(); }); } }

// localStorage cache
const SEED = {};
const LS_KEY="fs_cache_v2"; let LS=loadLS();
function loadLS(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"{}"); }catch(e){ return {}; } }
function saveLS(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(LS)); }catch(e){} }
function putCached(id,data){ LS[id]={ d:data.map(p=>[p.date,p.v]), ts:Date.now() }; saveLS(); }
function getCached(id){
  const e=LS[id];
  if(e&&e.d) return { data:e.d.map(a=>({date:a[0], t:Date.parse(a[0]), v:a[1]})), ts:e.ts };
  if(SEED[id]) return { data:SEED[id].map(a=>({date:a[0], t:Date.parse(a[0]), v:a[1]})), ts:0 };
  return null; }
function hasCache(){ try{ return Object.keys(LS).length>0; }catch(e){ return false; } }

// Treasury yields: weekly series, last ~15 years -> small payload that loads fast through public proxies.
const START={WGS2YR:"2011-01-01",WGS5YR:"2011-01-01",WGS10YR:"2011-01-01",WGS30YR:"2011-01-01",WGS3MO:"2011-01-01"};
const mem=new Map(), inflight=new Map();
async function fredLive(id, fast){
  const url="https://fred.stlouisfed.org/graph/fredgraph.csv?id="+id+(START[id]?("&cosd="+START[id]):"");
  const csv=await fetchText(url, fast);
  const lines=csv.trim().split("\n"); const out=[];
  for(let i=1;i<lines.length;i++){
    const c=lines[i].split(","); const d=c[0], v=c[1];
    if(!d || v===undefined || v==="." || v.trim()==="") continue;
    const n=parseFloat(v); if(!isFinite(n)) continue;
    out.push({date:d, t:Date.parse(d), v:n});
  }
  if(!out.length) throw new Error("empty series");
  return out;
}
// resolve a series once (shared across tiles); live -> cache fallback
function fredSeries(id, bg){
  if(mem.has(id)) return Promise.resolve({data:mem.get(id), stale:false});
  if(inflight.has(id)) return inflight.get(id);
  const p=(async()=>{
    try{ const data=await enqueue(()=>fredLive(id, !bg), !bg); mem.set(id,data); putCached(id,data); return {data, stale:false}; }
    catch(e){ const c=getCached(id); if(c){ mem.set(id,c.data); return {data:c.data, stale:true, ts:c.ts}; } throw e; }
    finally{ inflight.delete(id); }
  })();
  inflight.set(id,p); return p;
}

const scale=(arr,f)=>arr.map(p=>({...p, v:p.v*f}));

/* ============================================================ FORMATTING */
function fmtNum(v, opt={}){
  const {dec=0, pct=false, dollar=false, abbr=false} = opt;
  if(v==null||!isFinite(v)) return "—";
  let n=v, suf="";
  if(abbr){
    if(Math.abs(n)>=1e12){n/=1e12;suf="T";}
    else if(Math.abs(n)>=1e9){n/=1e9;suf="B";}
    else if(Math.abs(n)>=1e6){n/=1e6;suf="M";}
    else if(Math.abs(n)>=1e3){n/=1e3;suf="K";}
  }
  const s=n.toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec});
  return (dollar?"$":"")+s+suf+(pct?"%":"");
}
const fmtDate=d=>new Date(d).toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"});
const fmtMonthYr=d=>new Date(d).toLocaleDateString("en-US",{year:"numeric",month:"short"});

/* ============================================================ CHART RENDERER */
function niceTicks(min,max,count){
  const span=(max-min)||1, raw=span/count, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag; let step; if(norm<1.5)step=1;else if(norm<3)step=2;else if(norm<7)step=5;else step=10;
  step*=mag; const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, ticks=[];
  for(let v=lo;v<=hi+step/2;v+=step) ticks.push(+v.toFixed(10)); return {ticks,lo,hi};
}
function downsample(data,maxN){
  if(data.length<=maxN) return data;
  const stride=data.length/maxN, out=[];
  for(let i=0;i<maxN;i++) out.push(data[Math.floor(i*stride)]);
  out.push(data[data.length-1]); return out;
}
function renderChart(container, series, fmt={}){
  container.innerHTML="";
  const W=620,H=250,padL=52,padR=14,padT=12,padB=24;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const ds=series.map(s=>({...s, data:downsample(s.data,700)}));
  let tmin=Infinity,tmax=-Infinity,vmin=Infinity,vmax=-Infinity;
  ds.forEach(s=>s.data.forEach(p=>{ if(p.t<tmin)tmin=p.t; if(p.t>tmax)tmax=p.t; if(p.v<vmin)vmin=p.v; if(p.v>vmax)vmax=p.v; }));
  if(!isFinite(tmin)){ container.innerHTML='<div class="state">No data in range</div>'; return; }
  if(vmin===vmax){vmin-=1;vmax+=1;}
  const pd=(vmax-vmin)*0.08; vmin-=pd; vmax+=pd;
  const {ticks:yt,lo,hi}=niceTicks(vmin,vmax,4);
  const yLo=Math.min(lo,vmin), yHi=Math.max(hi,vmax);
  const X=t=>padL+((t-tmin)/((tmax-tmin)||1))*plotW;
  const Y=v=>padT+(1-(v-yLo)/((yHi-yLo)||1))*plotH;
  const mk=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const svg=mk("svg",{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:"none"});

  ds.forEach(s=>{ const d=s.data; if(!d.length)return;

    if(s.area){ const gid="g"+Math.random().toString(36).slice(2,7);

      svg.appendChild(mk("path",{d:line+` L${X(d[d.length-1].t)} ${Y(yLo)} L${X(d[0].t)} ${Y(yLo)} Z`,fill:`url(#${gid})`,stroke:"none"})); }
    svg.appendChild(mk("path",{d:line,fill:"none",stroke:s.color,"stroke-width":s.area?1.6:1.5,"stroke-linejoin":"round","stroke-linecap":"round","vector-effect":"non-scaling-stroke"})); });

  svg.appendChild(mk("line",{x1:padL,x2:padL,y1:padT,y2:H-padB,stroke:"#d5d9d2","stroke-width":1}));
  svg.appendChild(mk("line",{x1:padL,x2:W-padR,y1:H-padB,y2:H-padB,stroke:"#d5d9d2","stroke-width":1}));

  const guide=mk("line",{x1:0,x2:0,y1:padT,y2:H-padB,stroke:"#16233b","stroke-width":1,"stroke-dasharray":"3 3",opacity:0}); svg.appendChild(guide);
  const dots=ds.map(s=>{const c=mk("circle",{r:3.2,fill:"#fff",stroke:s.color,"stroke-width":2,opacity:0});svg.appendChild(c);return c;});

      html+=`<span class="tt-row"><i style="background:${s.color}"></i>${ds.length>1?s.label+": ":""}${fmtNum(best.v,fmt)}</span>`; });
    guide.setAttribute("x1",gx);guide.setAttribute("x2",gx);guide.setAttribute("opacity",.5);
    tip.innerHTML=html; tip.style.opacity=1; tip.style.left=(gx/W*r.width)+"px"; tip.style.top=(padT/H*r.height)+"px"; });
  svg.addEventListener("mouseleave",()=>{ tip.style.opacity=0; guide.setAttribute("opacity",0); dots.forEach(d=>d.setAttribute("opacity",0)); });
}

/* ============================================================ APP */
const navEl=document.getElementById("nav"), mainEl=document.getElementById("main");
let current=PAGES[0].id, latestObs=0;
const PRESETS=[["max","Max"],["20","20Y"],["10","10Y"],["5","5Y"],["1","1Y"]];

PAGES.forEach(p=>{ const b=document.createElement("button"); b.textContent=p.nav; b.dataset.id=p.id; b.onclick=()=>selectPage(p.id); navEl.appendChild(b); });

function buildCardSkeleton(panel){
  const wide=panel.wide?" wide":"";
  const legend=panel.series.length>1?`<div class="legend">${panel.series.map(s=>`<span><i style="background:${s.color}"></i>${s.label}</span>`).join("")}</div>`:"";
  const presets=PRESETS.map(([y,l])=>`<button data-yrs="${y}">${l}</button>`).join("");
  return `<div class="card${wide}" data-panel>
      <div class="chead"><div><div class="ctitle">${panel.title}</div><div class="cnote">${panel.note||""}</div></div>
        <div class="latest"><div class="val">—</div><div class="when"></div></div></div>
      ${legend}
      <div class="ctrls"><div class="rangebtns">${presets}</div><div class="ctrls-right"><span class="stale-note"></span><span class="dlbtns"><button data-dl="csv" title="Download chart data as CSV">CSV</button><button data-dl="xlsx" title="Download chart data as Excel">Excel</button></span></div></div>
      <div class="chart-wrap"><div class="state"><div><div class="spinner"></div>Loading…</div></div></div>
      <div class="brush"></div>
    </div>`;
}

function selectPage(id){
  current=id;
  [...navEl.querySelectorAll("button")].forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  const page=PAGES.find(p=>p.id===id);
  let html=`<div class="pagehead"><img class="fnf-logo" src="${LOGO_FULL}" alt="Crest"><div class="title">${page.title}</div></div>`;
  html+=`<div class="subhead"><div class="desc">${page.desc}</div><div class="tag">FRED · live</div></div>`;
  html+=`<div class="hint">Drag the slider beneath any chart — or use the range buttons — to focus on a time period. Hover for exact values.</div>`;
  if(page.note) html+=`<div class="banner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg><div>${page.note}</div></div>`;
  html+=`<div class="grid">${page.panels.map(buildCardSkeleton).join("")}</div>`;
  html+=footerHTML();
  mainEl.innerHTML=html;
  const cards=mainEl.querySelectorAll("[data-panel]");
  page.panels.forEach((panel,i)=>{ cards[i].style.animationDelay=(i*55)+"ms"; loadPanel(panel,cards[i]); });
}

function setLatest(card,panel,last){
  const lf=panel.latestFmt||panel.fmt;
  let txt=fmtNum(last.v,lf);
  if(lf.suffix && !lf.abbr) txt=fmtNum(last.v,{...lf,suffix:undefined})+lf.suffix;
  card.querySelector(".latest .val").textContent=txt;
  card.querySelector(".latest .when").textContent="as of "+fmtDate(last.date);
  if(last.t>latestObs){ latestObs=last.t; document.querySelector("#updated b").textContent=fmtDate(last.date); }
}

async function loadPanel(panel,card,attempt=0){
  const wrap=card.querySelector(".chart-wrap");
  if(attempt===0){
    // repeat visitors: paint cached data instantly, then refresh underneath
    const cached=panel.series.map(s=>{ const c=getCached(s.id); if(!c)return null;
      let d=c.data; if(s.transform)d=s.transform(d);
      return {label:s.label,color:s.color,area:s.area,data:d,stale:true}; });
    if(cached.every(Boolean)) setupPanel(card,panel,cached,true);
    else { wrap.innerHTML=`<div class="state"><div><div class="spinner"></div>Fetching live data…</div></div>`; card.querySelector(".brush").innerHTML=""; }
  }
  const results=await Promise.all(panel.series.map(async s=>{
    try{ const r=await fredSeries(s.id); let data=r.data; if(s.transform)data=s.transform(data);
      return {label:s.label,color:s.color,area:s.area,data,stale:r.stale}; }
    catch(e){ return null; }
  }));
  const ok=results.filter(Boolean);
  if(!ok.length){
    if(attempt<1){ await new Promise(r=>setTimeout(r,1200)); return loadPanel(panel,card,attempt+1); }
    wrap.innerHTML=`<div class="state err"><div>Public data proxy was busy.<div class="retry"><button class="btn">Retry</button></div></div></div>`;
    wrap.querySelector("button").onclick=()=>loadPanel(panel,card); return;
  }
  setupPanel(card,panel,ok,ok.some(r=>r.stale));
  if(ok.some(r=>!r.stale)) dismissFirstRun();
}

function fsSlug(t){ return (t||"data").replace(/[^a-z0-9]+/gi,"_").replace(/^_+|_+$/g,"").toLowerCase()||"data"; }
function fsBuildTable(series){
  const map=new Map();
  series.forEach(s=>s.data.forEach(p=>{ if(!map.has(p.date)) map.set(p.date,{}); map.get(p.date)[s.label]=p.v; }));
  const dates=[...map.keys()].sort();
  const cols=["Date",...series.map(s=>s.label)];
  const rows=dates.map(d=>[d,...series.map(s=>{ const v=map.get(d)[s.label]; return (v===undefined||v===null)?"":v; })]);
  return {cols,rows};
}
function fsCSV(cols,rows){
  const esc=x=>{ x=String(x); return /[",\n]/.test(x) ? '"'+x.replace(/"/g,'""')+'"' : x; };
  return [cols.map(esc).join(","), ...rows.map(r=>r.map(esc).join(","))].join("\n");
}
function fsDownload(filename, data, mime){
  const blob = (data instanceof Blob) ? data : new Blob([data], {type: mime||"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 150);
}
function exportCSV(panel, series){
  const {cols,rows}=fsBuildTable(series);
  fsDownload(fsSlug(panel.title)+".csv", "\ufeff"+fsCSV(cols,rows), "text/csv;charset=utf-8");
}
let fsXlsxP=null;
function fsLoadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(fsXlsxP) return fsXlsxP;
  const urls=["https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js",
              "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"];
  fsXlsxP=new Promise((resolve,reject)=>{
    let i=0; const tryNext=()=>{ if(window.XLSX)return resolve(window.XLSX); if(i>=urls.length)return reject(new Error("xlsx load failed"));
      const s=document.createElement("script"); s.src=urls[i++]; s.onload=()=>resolve(window.XLSX); s.onerror=tryNext; document.head.appendChild(s); };
    tryNext();
  });
  return fsXlsxP;
}
async function exportXLSX(panel, series, btn){
  const {cols,rows}=fsBuildTable(series);
  const label = btn ? btn.textContent : null;
  if(btn){ btn.disabled=true; btn.textContent="\u2026"; }
  try{
    const XLSX=await fsLoadXLSX();
    const ws=XLSX.utils.aoa_to_sheet([cols,...rows]);
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Data");
    XLSX.writeFile(wb, fsSlug(panel.title)+".xlsx");
  }catch(e){
    fsDownload(fsSlug(panel.title)+".csv", "\ufeff"+fsCSV(cols,rows), "text/csv;charset=utf-8");
  }finally{ if(btn){ btn.disabled=false; btn.textContent=label||"Excel"; } }
}

function setupPanel(card,panel,series,stale){
  const wrap=card.querySelector(".chart-wrap");
  const brushHost=card.querySelector(".brush"); brushHost.innerHTML="";
  const presetWrap=card.querySelector(".rangebtns");
  const staleNote=card.querySelector(".stale-note");

  const base=series[0].data, last=base[base.length-1];
  setLatest(card,panel,last);
  staleNote.innerHTML = stale
    ? `<span class="stale">⦿ cached · ${fmtDate(last.date)}</span>`
    : `<span class="livenote">● live</span>`;

  let t0=Infinity,t1=-Infinity;
  series.forEach(s=>s.data.forEach(p=>{ if(p.t<t0)t0=p.t; if(p.t>t1)t1=p.t; }));
  let win=[t0,t1];
  const clip=w=>series.map(s=>({...s, data:s.data.filter(p=>p.t>=w[0]&&p.t<=w[1])}));
  let raf=null;
  function renderMain(){ renderChart(wrap, clip(win), panel.fmt); }
  function schedule(){ if(raf)return; raf=requestAnimationFrame(()=>{raf=null;renderMain();}); }

  // ---- brush ----
  const BW=600, mk=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const tx=t=>((t-t0)/((t1-t0)||1))*BW;
  const bsvg=mk("svg",{viewBox:`0 0 ${BW} 34`,preserveAspectRatio:"none"});
  const ov=downsample(base,300); let mn=Infinity,mx=-Infinity; ov.forEach(p=>{if(p.v<mn)mn=p.v;if(p.v>mx)mx=p.v;}); if(mn===mx){mn-=1;mx+=1;}
  const vy=v=>4+(1-(v-mn)/((mx-mn)||1))*26;
  const ovPath="M"+ov.map(p=>tx(p.t).toFixed(1)+" "+vy(p.v).toFixed(1)).join(" L");
  bsvg.appendChild(mk("rect",{x:0,y:0,width:BW,height:34,rx:4,fill:"#f4f6f3"}));
  bsvg.appendChild(mk("path",{d:ovPath,fill:"none",stroke:"#b9c3d2","stroke-width":1,"vector-effect":"non-scaling-stroke"}));
  const dimL=mk("rect",{x:0,y:0,width:0,height:34,fill:"rgba(243,244,241,.66)"});
  const dimR=mk("rect",{x:0,y:0,width:0,height:34,fill:"rgba(243,244,241,.66)"});
  const sel=mk("rect",{class:"sel","data-mode":"pan",y:0,height:34,rx:3});
  const hL=mk("rect",{class:"handle","data-mode":"left",y:6,width:7,height:22,rx:2});
  const hR=mk("rect",{class:"handle","data-mode":"right",y:6,width:7,height:22,rx:2});
  bsvg.appendChild(dimL);bsvg.appendChild(dimR);bsvg.appendChild(sel);bsvg.appendChild(hL);bsvg.appendChild(hR);
  brushHost.appendChild(bsvg);
  function updateSel(){ const x0=tx(win[0]),x1=tx(win[1]);
    sel.setAttribute("x",x0); sel.setAttribute("width",Math.max(2,x1-x0));
    hL.setAttribute("x",x0-3.5); hR.setAttribute("x",x1-3.5);
    dimL.setAttribute("width",Math.max(0,x0)); dimR.setAttribute("x",x1); dimR.setAttribute("width",Math.max(0,BW-x1)); }

  let mode=null,sx=0,sw=null; const span=t1-t0, minW=span*0.015;
  bsvg.addEventListener("pointerdown",e=>{ const m=e.target.getAttribute("data-mode"); if(!m)return;
    mode=m; sx=e.clientX; sw=[...win]; try{bsvg.setPointerCapture(e.pointerId);}catch(x){} clearPresets(); e.preventDefault(); });
  bsvg.addEventListener("pointermove",e=>{ if(!mode)return; const r=bsvg.getBoundingClientRect();
    if(mode==="left"){ let nt=t0+((e.clientX-r.left)/r.width)*span; nt=Math.max(t0,Math.min(nt,win[1]-minW)); win=[nt,win[1]]; }
    else if(mode==="right"){ let nt=t0+((e.clientX-r.left)/r.width)*span; nt=Math.min(t1,Math.max(nt,win[0]+minW)); win=[win[0],nt]; }
    else { const dt=((e.clientX-sx)/r.width)*span; const w=sw[1]-sw[0]; let a=sw[0]+dt,b=sw[1]+dt;
      if(a<t0){a=t0;b=t0+w;} if(b>t1){b=t1;a=t1-w;} win=[a,b]; }
    updateSel(); schedule(); });
  const up=e=>{ if(mode){ mode=null; try{bsvg.releasePointerCapture(e.pointerId);}catch(x){} renderMain(); } };
  bsvg.addEventListener("pointerup",up); bsvg.addEventListener("pointercancel",up); bsvg.addEventListener("pointerleave",up);

  // ---- presets ----
  function clearPresets(){ presetWrap.querySelectorAll("button").forEach(b=>b.classList.remove("on")); }
  presetWrap.querySelectorAll("button").forEach(b=>{ b.onclick=()=>{
    const y=b.dataset.yrs; win = (y==="max") ? [t0,t1] : [Math.max(t0,t1-(+y)*YEAR_MS), t1];
    clearPresets(); b.classList.add("on"); updateSel(); renderMain(); }; });
  const def=presetWrap.querySelector('[data-yrs="max"]'); if(def) def.classList.add("on");
  const dl=card.querySelector(".dlbtns");
  if(dl){ const c=dl.querySelector('[data-dl="csv"]'), x=dl.querySelector('[data-dl="xlsx"]');
    if(c) c.onclick=()=>exportCSV(panel,series);
    if(x) x.onclick=()=>exportXLSX(panel,series,x); }

  updateSel(); renderMain();
}

function footerHTML(){
  return `<div class="footer"><strong>About this dashboard.</strong> A rebuild of an old Power BI "Financial Stats" report that pulls <em>live</em> data
    from the St. Louis Fed (<a href="https://fred.stlouisfed.org" target="_blank" rel="noopener">FRED</a>) public CSV feed — no API key.
    Browsers block direct requests to FRED, so calls route through public CORS proxies (with fallbacks) and are throttled to avoid rate limits.
    Each loaded series is cached in your browser, so charts stay populated and refresh to the latest reading on the next visit;
    a tile marked <span style="color:var(--gold)">cached</span> is showing last-known-good data because a live refresh didn't get through — hit <em>Refresh latest</em> or the tile's <em>Retry</em>.
    Panels map to FRED series IDs (e.g. <code>GDP</code>, <code>CPIAUCSL</code>, <code>UNRATE</code>, <code>MORTGAGE30US</code>, <code>CSUSHPISA</code>, <code>DGS10</code>, <code>UMCSENT</code>, <code>POPTHM</code>).
    Proprietary series from the original (Shiller CAPE, S&P earnings breakdowns, Conference Board confidence) aren't in any free public feed and are flagged where they appear. Public-domain data; not investment advice. Contact <a href="mailto:scott.foster@fnf.com">scott.foster@fnf.com</a> with questions or concerns.</div>`;
}

let prefetched=false;
function prefetchAll(){
  if(prefetched) return; prefetched=true;
  const ids=[...new Set(PAGES.flatMap(p=>p.panels.flatMap(pa=>pa.series.map(s=>s.id))))];
  ids.forEach(id=>{ if(!mem.has(id)) fredSeries(id,true).catch(()=>{}); });
}
function dismissFirstRun(){ const f=document.getElementById("firstrun"); if(f && !f.classList.contains("hidden")) f.classList.add("hidden"); }
document.getElementById("refresh").onclick=()=>{ mem.clear(); selectPage(current); };
if(!hasCache() && !Object.keys(SEED).length){ const f=document.getElementById("firstrun"); if(f) f.classList.remove("hidden"); }
const frx=document.getElementById("frx"); if(frx) frx.onclick=dismissFirstRun;
selectPage(current);
setTimeout(prefetchAll, 1200);
</script>
